repos:
  - repo: local
    hooks:
      - id: run-tests
        name: Run tests
        entry: bash -c 'output=$(./scripts/run_test_suite.sh 2>&1) || { printf "%s\n" "$output"; exit 1; }'
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd cli && golangci-lint run --config ../.golangci.yml'
        language: system
        pass_filenames: false
        types: [go]

      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: bash -c 'cd cli && golangci-lint fmt --config ../.golangci.yml'
        language: system
        pass_filenames: false
        types: [go]

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua

  - repo: local
    hooks:
      - id: luacheck
        name: Luacheck
        entry: luacheck
        language: system
        types: [lua]
